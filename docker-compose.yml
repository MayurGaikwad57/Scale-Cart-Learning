services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: scalecart
      POSTGRES_PASSWORD: scalecart
      POSTGRES_DB: scalecart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scalecart"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
